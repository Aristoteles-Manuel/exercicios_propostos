<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Número positivo</h1>
    <p><input type="number" name="n" id="txtn">
    <input type="button" value="Mostrar" onclick="mostrar()"></p>
    <div id="res"></div>
    <script>
        function mostrar(){
            var num=window.document.querySelector('input#txtn')
            var res=window.document.querySelector('div#res')
            var n = Number(num.value)
            res.innerHTML='Resultado:'
            if(n>=1){
                res.innerHTML+=`O número ${n} é positivo.`
            }else if (n<1 && n!=0){
                res.innerHTML+=`O número ${n} é Negativo.`

            }else{
                res.innerHTML+=`O número ${n} é Neutro.`
            }
        }
    </script>
</body>
</html>
