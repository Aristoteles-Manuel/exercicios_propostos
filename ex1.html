<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Olá utilizador</h1>
    <div id="res"></div>
    <script>

        var nome=window.prompt('Qual é o seu nome?')
        window.alert('Olá  '+ nome + ' seja bem-vindo.')
        var res =window.document.getElementById('res')
        res.innerHTML=`Olá seu nome é ${nome} ele tem ${nome.length} em maiúsculas é ${nome.toUpperCase()} e em menúsculas ${nome.toLocaleLowerCase()}`
    </script>
</body>
</html>
