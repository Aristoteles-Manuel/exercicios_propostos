<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <style>
        :root{
  --fundo:#0f1f7a; --fundo2:rgba(11, 87, 228, 0.795);
  --cartao:#e8e6f0; --texto:#22203a;
  --acao:#2bb84f; --raio:14px;
}
*{box-sizing:border-box}

html{
  min-height:100%;
  background:linear-gradient(var(--fundo),var(--fundo2)) fixed;
}
body{
  font-family:system-ui,sans-serif;
  color:var(--texto);
  max-width:420px;
  margin:32px auto;
  padding:20px;
  background:var(--cartao);
  border-radius:calc(var(--raio)*1.5);
  display:flex;
  flex-direction:column;
  gap:14px;
}
h1{margin:0;font-size:1.4rem}

input,select,textarea{
  width:100%;
  padding:16px;
  font-size:1rem;
  border:1px solid #ccc;
  border-radius:var(--raio);
  background:#fff;
}
button{
  padding:16px;
  border:0;
  border-radius:var(--raio);
  background:var(--acao);
  color:#fff;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
}
button:hover{filter:brightness(1.1)}

body > div{background:#fff;padding:16px;border-radius:var(--raio)}
body > div:empty{display:none}

    </style>
    <h1>Jogo da Senha</h1>
   
        Número: <input type="number" name="n" id="txtn">
        <button id="btn">Mostrar</button>
   
    <div id="res">Resultado:</div>
    <script>
        const btn = document.querySelector('#btn')
        btn.addEventListener('click', mostrar)
        function mostrar(){
            let num=window.document.getElementById('txtn')
            let res =window.document.getElementById('res')
            let r1 =Math.floor(Math.random()*3)+1
            let r2 =Math.floor(Math.random()*3)+1
            let n=Number(num.value)
            res.innerHTML=''
            let sequencia=`${r1}${r2}`
            let resposta = num.value
            if(resposta===""){
                res.innerHTML='[ERRO❌] Digite primeiro uma senha'
            } else if(resposta===sequencia){
               res.innerHTML=`Você ganhou! eu pensei mesmo na sequência ${sequencia} 😮` 
            }else if(resposta!=sequencia){
                res.innerHTML=`perdeu eu pensei em ${sequencia} 😁`
            }  
            num.value=''
            
        }
    </script>
</body>
</html>
