<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Jogo da Senha</h1>
    <div id="res">

    </div>
    <script>
        var res = window.document.getElementById('res')
        var n=Number(window.prompt('Dgite um número.'))
        var r =Math.floor(Math.random()*3)
        if (n==r){
            res.innerHTML=`Você ganhou! eu pensei no ${r}`

        }else if(n!=r){
            res.innerHTML=`Você perdeu! eu pensei no ${r}`
        }
    </script>
</body>
</html>
