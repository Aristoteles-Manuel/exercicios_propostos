<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Operacões com números.</h1>
    <p>Numeros:<input type="number" name="n1" id="txtn1"> + <input type="number" name="n2" id="txtn2"> <input type="button" value="calcular" onclick="calcular()"></p>
    <div id="res">Resultado:</div>
    <script>
       var p=window.prompt( `Informe a opercão que pretende realizar soma para soma, sub para subtração, Mult para multiplicação e div para divisão.`)
        function calcular(){
           var num1=window.document.getElementById('txtn1')
           var num2=window.document.getElementById('txtn2')
           var res=window.document.getElementById('res')
           var n1 =Number(num1.value)
           var n2 =Number(num2.value)
          
           if(p=='soma'){
             var soma = n1 + n2
             res.innerHTML+=`${soma}`
           }else if(p=='Mult'){
            var mult= n1*n2
             res.innerHTML+=`${mult}`
           }else if(p =='div'){
            var div =n1/n2 
             res.innerHTML+=`${div}`
           }else if(p=='sub'){
            var sub=n1-n2
             res.innerHTML+=`${sub}`

           }else{
            alert('Retroceda a página e escolha uma operação')
           }
           


        }
    </script>
</body>
</html>
