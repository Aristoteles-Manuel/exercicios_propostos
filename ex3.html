<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Sucessor e Antecessor</h1>
    <p>Número:<input type="number" name="n" id="txtn"> 
        <input type="button" value="Mostrar" onclick="mostrar()">
    </p>
    <div id="res"></div>
    <script>
        function mostrar(){
          var num =window.document.querySelector('input#txtn')
        var res = window.document.querySelector('div#res') 
        var n =Number(num.value) 
        res.innerHTML=` O sucessor de ${n} é ${++n} e o anecessor é ${n-2}`
        }
        

    </script>
</body>
</html>
