<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Maior Número</h1>
    <div id="res">Resultado:</div>
    <script>
        var n1=Number(window.prompt('Digite o primeiro número.'))
        var n2=Number(window.prompt('Digite o segundo número.'))
        var n3=Number(window.prompt('Digite o terceiro número.'))
        var res =window.document.querySelector('div#res')
        if(n1>n2 && n1>n3){
            res.innerHTML+=`Entre ${n1}, ${n2} e ${n3} o maior número  é ${n1}`

        }else if(n2>n1 && n2>n3){
            res.innerHTML+=`Entre ${n1}, ${n2} e ${n3} o maior número  é ${n2}`

        }else if(n3>n1 && n3>n2){
            
            res.innerHTML+=`Entre ${n1}, ${n2} e ${n3} o maior número  é ${n3}`
        }else{
            res.innerHTML+=`Os três números são iguais não exite um maior entre eles.`
        }

    </script>
</body>
</html>
