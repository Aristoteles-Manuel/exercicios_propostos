<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>
<body>
    <style>
        :root{
  --fundo:#0f1f7a; --fundo2:#050b3a;
  --cartao:#e8e6f0; --texto:#22203a;
  --acao:#2bb84f; --raio:14px;
}
*{box-sizing:border-box}

html{
  min-height:100%;
  background:linear-gradient(var(--fundo),var(--fundo2)) fixed;
}
body{
  font-family:system-ui,sans-serif;
  color:var(--texto);
  max-width:420px;
  margin:32px auto;
  padding:20px;
  background:var(--cartao);
  border-radius:calc(var(--raio)*1.5);
  display:flex;
  flex-direction:column;
  gap:14px;
}
h1{margin:0;font-size:1.4rem}

input,select,textarea{
  width:100%;
  padding:16px;
  font-size:1rem;
  border:1px solid #ccc;
  border-radius:var(--raio);
  background:#fff;
}
button{
  padding:16px;
  border:0;
  border-radius:var(--raio);
  background:var(--acao);
  color:#fff;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
}
button:hover{filter:brightness(1.1)}

body > div{background:#fff;padding:16px;border-radius:var(--raio)}
body > div:empty{display:none}

    </style>
    <h1>Idade</h1>
    Seu ano de nascimento:<input type="number" name="idade" id="idade">
    <button id="btn">mostrar</button>

    <div id="res"></div>
    
    <script>
        const btn=document.querySelector('#btn')
        btn.addEventListener('click',mostrar)
        function mostrar(){
         let seu_ano=document.querySelector('input#idade')
         let res=document.querySelector('div#res')
        let ano_nascimento=Number(seu_ano.value)
        let tempo =new Date()
        let ano_atual = tempo.getFullYear()
        let idade =ano_atual-ano_nascimento
        if(idade<=12 && idade>=0){
           res.innerHTML=` Criançade ${idade} anos.` 
        }else if (idade>=13 && idade<18){
             res.innerHTML=` Adolescente de ${idade} anos.` 
        }else if (idade>=18 && idade<=60){
            res.innerHTML=` Adulto de ${idade} anos.` 
        }else if(idade>59 && idade<150){
            res.innerHTML=`Idoso de ${idade} anos.`
        }
        else{
             res.innerHTML=`<strong>Ano de nascimento fora do padrão.</strong>`
        }
        }
       
    </script>
</body>
</html>
