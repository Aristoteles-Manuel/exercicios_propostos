<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Somando números</h1>
    Números: <input type="number" name="num" id="num"> <input type="button" value="adicionar" onclick="adicionar()"><br>
    <select name="lista" id="lista" size="7" style="width: 150px;"></select>
    <br>
    <input type="button" value="mostrar" onclick="mostrar()"> 
    <br>
    <div id="res"></div>
    <script>
            let num = document.querySelector('input#num')
            let resultado = document.querySelector('div#res')
            let lista = document.querySelector('select#lista')
            let numeros = []

        function adicionar(){
             
            numeros.push(Number(num.value))
            
            
            let  item =document.createElement('option')
             item.innerText=`Valor ${num.value} adicionado.`
           
            lista.appendChild(item)
            
             
        }
        
        function mostrar(){
            
                  let menor = numeros.reduce(function 
                  (acumular,numero){
                    if(numero<acumular){
                        return numero
                    }else{
                        return acumular
                    }
                   

})
            
             resultado.innerHTML=`${menor}`
             
        }
    </script>
    
</body>
</html>
