<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="modelo.css">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(11, 87, 228, 0.795);
        }
        header{
            text-align: center;
            color: white;
        }
        section{
            background-color: white;
            padding: 15px;
            width: 500px;
            border-radius: 10px;
            margin: auto;
        }
        select#flista{
            width: 250px;
        }
        footer{
           text-align: center;
           color: white;
           font-style: italicolá ;
        } 
    </style>
   
    <header>
        <h1>Lista de Compras</h1>
    </header>
    <section>
        <div>Frutas: 
            <input type="text" name="fruta" id="fruta">
            <input type="button" value="Adicionar" onclick="adicionar()"> <br><br>
            <select name="flista" id="flista" size="6"></select>
            <br>
            <input type="button" value="Finalizar" onclick="finalizar()">

        </div>
        <div id="res"></div>
    </section>
    <footer><p> &copy;  Aristóteles M. Sites</p></footer>
    <script>
        let fruta=document.querySelector('input#fruta')
        let lista =document.querySelector('select#flista')
        let res = document.querySelector('div#res')
        let frutas =[]

        function adicionar() {
    if (fruta.value.trim() === '') {
        alert('Escreve o nome de uma fruta!')
        return
    }

    frutas.push(fruta.value)

    let item = document.createElement('option')
    item.textContent = ` Nova fruta adicionada ${fruta.value}.`

    lista.appendChild(item)

    res.innerHTML = ''

    fruta.value = ''
    fruta.focus()
}
function finalizar(){
    if(frutas.length==0){
        window.alert('Adicionar frutas a lista antes de finalizar')
    }else if(frutas.length==1){
        res.innerHTML=`Temos  apenas ${total}  fruta  cadastrada na lista.`
    }
    else{
        let total = frutas.length
        res.innerHTML=`Temos ${total}  frutas  cadastradas na lista.`
    } 
    
}
         
    


    </script>
</body>
</html>
