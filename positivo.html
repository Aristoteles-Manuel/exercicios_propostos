<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Positivo</title>
</head>
<body>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(11, 87, 228, 0.795);
          
        }
        header{
            text-align: center;
            color: white;
        }
        section{
            background-color: white;
            padding: 15px;
            width: 500px;
            border-radius: 10px;
            margin: auto;
        }
        select#ires{
            width: 200px;
        }
        footer{
           text-align: center;
           color: white;
           font-style: italicolá ;
        } 
    </style> 
   

    <header>
        <h1>Leia Positivo</h1>
    </header>
    
    <section>
        
    <p> Número: <input type="number" name="num" id="tnum">
    <input type="button" value="Adicionar" onclick="adicionar()">
    </p>
    <select name="res" id="ires" size="7"></select>
    </section>
    <footer><p> &copy;  Aristóteles M. Sites</p></footer>

    <script>
        function adicionar(){
            let num = window.document.querySelector('input#tnum')
            let res = window.document.querySelector('select#ires')
            
             let  item =document.createElement('option')
            item.innerText=`Valor ${num.value} adicionado.`
             res.appendChild(item)
           
            
            if(num.value<=0){
                alert('[ERRO] SÓ são aceites númros positivos. ' + num.value + ' não é positivo')
            } 
             num.value=''
        }
    </script>
    
</body>
</html>
